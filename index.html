<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payment Terms por cliente</title>
<style>
  :root {
    --bg: #f5f5f5; --surface: #ffffff; --tabs: #eeeeee; --text: #212121; --muted: #616161;
    --line: #e0e0e0; --line-strong: #bdbdbd; --accent: #1976d2; --accent-soft: #e3f2fd;
  }
  * { box-sizing: border-box; }
  body { margin: 0; padding: 24px 16px; background: var(--bg); color: var(--text); font: 14px/1.5 Roboto, "Segoe UI", Arial, sans-serif; }
  .card { max-width: 860px; margin: 0 auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; overflow: hidden; }
  .tabs { display: flex; flex-wrap: wrap; gap: 24px; padding: 14px 20px; background: var(--tabs); font-size: 13px; font-weight: 500; letter-spacing: .6px; color: var(--muted); }
  .tabs .active { color: var(--accent); }
  .body { padding: 16px 20px 20px; }
  h1 { margin: 0; padding-bottom: 12px; border-bottom: 1px solid var(--line); font-size: 20px; font-weight: 500; }
  .grid { display: grid; grid-template-columns: 180px minmax(0, 1fr); row-gap: 6px; padding: 14px 0; color: var(--muted); }
  .row { display: flex; align-items: center; gap: 10px; padding: 14px 0; border-top: 1px solid var(--line); color: var(--muted); }
  .new { border: 2px solid var(--accent); border-radius: 8px; padding: 14px 16px; margin-top: 4px; }
  .new-head { display: flex; justify-content: space-between; align-items: center; gap: 12px; margin-bottom: 10px; }
  .new-head h2 { margin: 0; font-size: 15px; font-weight: 500; }
  .badge { background: var(--accent-soft); color: #0d47a1; font-size: 12px; padding: 2px 10px; border-radius: 8px; white-space: nowrap; }
  .options { display: flex; flex-wrap: wrap; gap: 20px; margin-bottom: 10px; }
  .options label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
  input[type=radio], input[type=checkbox] { accent-color: var(--accent); margin: 0; }
  textarea { width: 100%; min-height: 84px; padding: 10px 12px; border: 1px solid var(--line-strong); border-radius: 8px; color: var(--text); font: inherit; resize: vertical; }
  textarea:read-only { background: var(--bg); color: var(--muted); }
  .hint { margin-top: 8px; font-size: 12px; color: var(--muted); }
  @media (max-width: 520px) { .grid { grid-template-columns: 130px minmax(0, 1fr); } }
</style>
</head>
<body>
<main class="card">
  <nav class="tabs" aria-label="Secciones del cliente">
    <span class="active">GENERAL INFORMATION</span><span>DOCUMENTS</span><span>QUOTES</span>
  </nav>
  <div class="body">
    <h1>Cliente de ejemplo</h1>
    <div class="grid">
      <span>City</span><span>Bogotá</span>
      <span>Currency</span><span>COP</span>
      <span>Margin</span><span>XX %</span>
      <span>Language</span><span>Español</span>
      <span>Standard Client</span><span><input type="checkbox" aria-label="Standard Client"></span>
    </div>
    <div class="row">
      <label for="directed">Enabled Directed Quotes for Client</label>
      <input id="directed" type="checkbox">
    </div>
    <section class="new" aria-labelledby="pt-title">
      <div class="new-head">
        <h2 id="pt-title">Payment Terms</h2>
        <span class="badge">Sección nueva</span>
      </div>
      <div class="options">
        <label><input type="radio" name="terms" value="standard">Standard terms</label>
        <label><input type="radio" name="terms" value="custom" checked>Custom terms</label>
      </div>
      <textarea id="terms" aria-labelledby="pt-title">40% Advance, 30% Before shipment and 30% 30 days after shipment.</textarea>
      <div class="hint" id="hint">Se insertará en Commercial Terms de cada cotización nueva.</div>
    </section>
  </div>
</main>
<script>
  const standard = "40% Advance, 30% Before shipment and 30% 30 days after shipment.";
  const box = document.getElementById("terms");
  const hint = document.getElementById("hint");
  let custom = box.value;
  document.querySelectorAll("input[name=terms]").forEach((radio) => {
    radio.addEventListener("change", () => {
      const isStandard = radio.value === "standard";
      if (isStandard) custom = box.value;
      box.value = isStandard ? standard : custom;
      box.readOnly = isStandard;
      hint.textContent = isStandard
        ? "Usa el texto estándar definido en Settings."
        : "Se insertará en Commercial Terms de cada cotización nueva.";
    });
  });
</script>
</body>
</html>
